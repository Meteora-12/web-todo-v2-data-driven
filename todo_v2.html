<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Todo 列表 V2.0（数据驱动·完整版）</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 420px; margin: 40px auto; }
        #todoList li { margin: 4px 0; cursor: pointer; }
        #todoList li.done { text-decoration: line-through; color: #999; }
        #todoList li button { margin-left: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Todo 列表</h2>
    <input type="text" id="todoInput" placeholder="请输入待办事项">
    <button id="addBtn">添加</button>
    <ul id="todoList"></ul>

    <script>
        // ===== 单一数据源：todos 数组是唯一状态来源，DOM 由 render() 投影 =====
        let todos = [];

        // 添加：展开生成新数组（不可变更新）
        function addTodo(text) {
            text = text.trim();
            if (text === '') return; // 空输入（含纯空格）不添加
            todos = [...todos, { id: Date.now(), text, completed: false }];
            render();
        }

        // 删除：filter 生成新数组
        function removeTodo(id) {
            todos = todos.filter(t => t.id !== id);
            render();
        }

        // 切换：map + 展开生成新对象
        function toggleTodo(id) {
            todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            render();
        }

        // ★ 记录3（脱离AI小改）：请脱离AI独立在此实现 clearCompleted()
        // 功能：删除所有 completed === true 的任务，改数据后记得 render()

        // 渲染：DOM 是 todos 的投影，不使用 innerHTML 拼接文本
        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';

            todos.forEach(t => {
                const li = document.createElement('li');
                li.textContent = t.text;
                if (t.completed) li.className = 'done';

                // 点击整行切换完成状态
                li.addEventListener('click', () => toggleTodo(t.id));

                // 删除按钮（阻止冒泡，避免误触发行切换）
                const del = document.createElement('button');
                del.textContent = '删除';
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTodo(t.id);
                });
                li.appendChild(del);

                list.appendChild(li);
            });
        }

        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('todoInput');
            addTodo(input.value);
            input.value = '';
        });

        render();
    </script>
</body>
</html>
