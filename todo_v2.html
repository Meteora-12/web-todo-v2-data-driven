<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Todo 列表 V2.0（事件委托版）</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 420px; margin: 40px auto; }
        #todoList li { margin: 4px 0; cursor: pointer; }
        #todoList li.done { text-decoration: line-through; color: #999; }
        #todoList li button { margin-left: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Todo 列表</h2>
    <input type="text" id="todoInput" placeholder="请输入待办事项">
    <button id="addBtn">添加</button>

    <div class="filters">
        <button data-filter="all">全部</button>
        <button data-filter="active">未完成</button>
        <button data-filter="done">已完成</button>
    </div>

    <ul id="todoList"></ul>

    <script>
        // ===== 单一数据源：todos 数组是唯一状态来源，DOM 由 render() 投影 =====
        let todos = load();
        let filter = 'all'; // 视图状态：不保存，刷新回到 'all'

        // 持久化：保存到 localStorage
        function save() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // 持久化：启动时从 localStorage 恢复
        function load() {
            const raw = localStorage.getItem('todos');
            if (!raw) return [];
            try {
                return JSON.parse(raw);
            } catch (e) {
                return []; // 数据损坏时兜底，避免脚本崩溃
            }
        }

        // 添加：展开生成新数组（不可变更新）
        function addTodo(text) {
            text = text.trim();
            if (text === '') return; // 空输入（含纯空格）不添加
            // id 用字符串存：因为 dataset.id 读出来一定是字符串，保持一致避免严格比较 !== 永远不相等
            todos = [...todos, { id: String(Date.now()), text, completed: false }];
            save();
            render();
        }

        // 删除：filter 生成新数组
        function removeTodo(id) {
            console.log('removeTodo', id);
            todos = todos.filter(t => t.id !== id);
            save();
            render();
        }

        // 切换：map + 展开生成新对象
        function toggleTodo(id) {
            console.log('toggleTodo', id);
            todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            save();
            render();
        }

        // 编辑：map + 展开生成新对象，只改 text（任务3 独立迁移）
        function editTodo(id, newText) {
            newText = newText.trim();
            if (newText === '') return; // 空文字不改
            todos = todos.map(t => t.id === id ? { ...t, text: newText } : t);
            save();
            render();
        }

        // 删除所有已完成任务
        function clearCompleted() {
            todos = todos.filter(t => !t.completed);
            save();
            render();
        }

        // 筛选：视图状态切换，只重渲染，不保存
        function setFilter(f) {
            filter = f;
            render();
        }

        // 渲染：DOM 是 todos 的投影。关键改动——不再给每个 li / 按钮单独绑监听，
        // 而是把 id 挂到 dataset、把删除按钮用 data-action 标记，交给父容器统一处理。
        function render() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';

            const visible = todos.filter(t => {
                if (filter === 'done') return t.completed;
                if (filter === 'active') return !t.completed;
                return true; // 'all'
            });

            visible.forEach(t => {
                const li = document.createElement('li');
                li.dataset.id = t.id;          // 关键：任务 id 挂到 DOM 上，供委托读取
                li.textContent = t.text;
                if (t.completed) li.className = 'done';

                const del = document.createElement('button');
                del.textContent = '删除';
                del.dataset.action = 'delete'; // 关键：标记这是删除按钮
                li.appendChild(del);

                const edit = document.createElement('button');
                edit.textContent = '编辑';
                edit.dataset.action = 'edit';  // 关键：标记这是编辑按钮
                li.appendChild(edit);

                list.appendChild(li);
            });
        }

        // ===== 事件委托：只在父容器 ul 上绑一个 click，统一处理切换 / 删除 =====
        const list = document.getElementById('todoList');
        list.addEventListener('click', (e) => {
            if (!(e.target instanceof Element)) return;       // 边界防御①：排除文本节点
            const item = e.target.closest('li');              // 找到被点中的任务 li
            if (!item || !list.contains(item)) return;        // 边界防御②：不在列表内则忽略
            const id = item.dataset.id;                       // 从 dataset 取任务 id
            if (!id) return;                                  // 边界防御③：无 id 则忽略

            const delBtn = e.target.closest('[data-action="delete"]');
            if (delBtn && item.contains(delBtn)) {
                removeTodo(id);  // 点删除按钮 → 只删除
                return;          // 关键：删除后立即返回，不再往下切换
            }

            const editBtn = e.target.closest('[data-action="edit"]');
            if (editBtn && item.contains(editBtn)) {
                const newText = prompt('修改任务', item.textContent);
                editTodo(id, newText); // 点编辑按钮 → 改文字
                return;                // 改完立即返回，不再往下切换
            }

            toggleTodo(id);      // 否则视为点击任务本身 → 切换完成状态
        });

        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('todoInput');
            addTodo(input.value);
            input.value = '';
        });

        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => setFilter(btn.dataset.filter));
        });

        render();
    </script>
</body>
</html>
